<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a101d">
<title>Bed Board — ED Bed Manager</title>
<style>
:root{
  --bg:#0a101d; --panel:#111a2d; --panel2:#16213a; --line:#24324f; --text:#dfe8f6; --muted:#8798b6; --dim:#5b6b88;
  --e1:#e5484d; --e2:#f76b15; --e3:#f2c94c; --e4:#30a46c; --e5:#3e8ed0;
  --good:#30a46c; --fair:#f2a33a; --poor:#e5484d; --accent:#4cc3ff; --purple:#a77bf3; --dirty:#8a5a2b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
body.has-sel{padding-bottom:150px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ---------- header ---------- */
#top{position:sticky;top:0;z-index:20;background:#0d1526ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px}
.brand{font-weight:700;letter-spacing:.04em;font-size:13px;color:var(--accent);text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
.clock{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.clock small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.speeds{display:flex;gap:4px}
.speeds button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:38px;font-family:var(--mono);font-size:12px}
.speeds button.on{background:var(--accent);color:#04121c;border-color:var(--accent);font-weight:700}
.metrics{display:flex;flex-wrap:wrap;gap:6px;flex:1;justify-content:flex-end}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);white-space:nowrap}
.metric b{font-family:var(--mono);color:var(--text);font-size:13px;margin-left:3px}
.metric.warn b{color:var(--fair)} .metric.bad b{color:var(--poor)}
.metric.grade{border-color:var(--accent)} .metric.grade b{color:var(--accent)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px}

/* ---------- layout ---------- */
#layout{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-areas:"side map" "info map";grid-template-rows:auto 1fr;gap:10px;padding:10px;max-width:1700px;margin:0 auto}
#side{grid-area:side;scroll-margin-top:120px} .rm{scroll-margin-top:120px} #map{grid-area:map} #info{grid-area:info}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.panel h2,.area h2{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.panel h2 .count,.area h2 .count{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:0 7px;font-family:var(--mono);font-size:11px}
.panel h2 .hint,.area h2 .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim);font-size:10px}
.qsec + .qsec{margin-top:10px}
.qlist{display:flex;flex-direction:column;gap:4px}
.qempty{color:var(--dim);font-size:12px;padding:4px 2px}

.qrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:5px 7px;text-align:left;width:100%}
.qrow .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tm{font-family:var(--mono);font-size:12px;text-align:right}
.qrow .tm small{display:block;font-size:9px;color:var(--dim);letter-spacing:.04em}
.qrow.sel{outline:2px solid var(--accent);outline-offset:1px}
.qrow.l1{border-left-color:var(--e1)} .qrow.l2{border-left-color:var(--e2)} .qrow.l3{border-left-color:var(--e3)} .qrow.l4{border-left-color:var(--e4)} .qrow.l5{border-left-color:var(--e5)}
.tm.late{color:var(--fair)} .tm.vlate{color:var(--poor);font-weight:700}

.esi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-family:var(--mono);font-weight:800;font-size:12px;color:#fff;flex:none}
.e1{background:var(--e1)} .e2{background:var(--e2)} .e3{background:var(--e3);color:#1b1500} .e4{background:var(--e4)} .e5{background:var(--e5)}
.flag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;border-radius:3px;padding:1px 3px;margin-left:3px;vertical-align:1px;background:#2a3858;color:#cfe0ff}
.flag.ems{background:#5a1f22;color:#ffc9cb} .flag.peds{background:#1f4a5a;color:#bff0ff} .flag.bh{background:#3d2a5c;color:#e3d2ff}
.flag.tr{background:#6b1f1f;color:#ffd0d0} .flag.vip{background:#5c4a12;color:#ffe9a8}
.flag.red{background:var(--e1);color:#fff} .flag.yel{background:var(--e3);color:#1b1500} .flag.grn{background:var(--e4);color:#fff}

/* ---------- map (floor plan) ---------- */
#map{background:#070b14;border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden;min-width:0}
.plan{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.plan.port{max-width:620px;margin:0 auto}
.plan text{font-family:var(--sans);fill:var(--text)}
.bldg{fill:#111a2d;stroke:#7186ad;stroke-width:4}
.zone{fill:#111a2d;stroke:#4e6187;stroke-width:2}
.zone.surge-on{stroke:var(--fair);stroke-width:3}
.secure-in{fill:none;stroke:#7d5bc4;stroke-width:1.5;stroke-dasharray:6 4}
.corr{stroke:#4e6187;stroke-width:1}
.t-corr{font:800 22px var(--sans);letter-spacing:.35em;fill:#24345a !important}
.t-zl{font-size:11px;font-weight:800;letter-spacing:.12em;fill:#93a6cb !important}
.t-zc{font-size:11px;font-weight:700}
.t-mut{fill:#8496b8 !important}
.t-id{font-family:var(--mono) !important;font-weight:800;fill:#fff !important}
.t-nm{font-weight:700;fill:#eef3fc !important}
.t-cc{fill:#b4c1d9 !important}
.t-ready{fill:#5fd59a !important;font-weight:800;letter-spacing:.06em}
.t-dirty{fill:#e7a35f !important;font-family:var(--mono) !important;font-weight:800;letter-spacing:.08em}
.t-cln{fill:#7cc8ef !important;font-family:var(--mono) !important;font-weight:800;letter-spacing:.06em}
.t-acc{fill:var(--accent) !important;font-weight:800;letter-spacing:.06em}
.t-warn{fill:#ff8f92 !important;font-weight:800}
.t-stn{font-size:11px;font-weight:800;letter-spacing:.1em;fill:#a9bbdc !important}
.t-fit{font-weight:700}
.t-wait{fill:#a9b7cf !important}
.t-wait.late{fill:var(--fair) !important}.t-wait.vlate{fill:var(--poor) !important;font-weight:800}
.los{fill:#8fa1c2 !important;font-family:var(--mono) !important}
.los.late{fill:var(--fair) !important}.los.vlate{fill:var(--poor) !important;font-weight:800}
.st{font-weight:700;fill:#8fa1c2 !important}
.st.s-need{fill:#ffb3b5 !important}.st.s-md{fill:var(--accent) !important}.st.s-tests{fill:var(--e3) !important}.st.s-res{fill:#7ff0e0 !important}
.st.s-dc{fill:#6fe39b !important}.st.s-adm{fill:var(--purple) !important}.st.s-obs{fill:#f0a3ff !important}
.b1{fill:var(--e1)}.b2{fill:var(--e2)}.b3{fill:var(--e3)}.b4{fill:var(--e4)}.b5{fill:var(--e5)}
.bt{font-family:var(--mono) !important;font-weight:800;fill:#fff !important}.bt3{fill:#1b1500 !important}
.f-ems{fill:#ff9ea2 !important;font-weight:800}.f-bh{fill:#cdb4ff !important;font-weight:800}.f-peds{fill:#8fe3ff !important;font-weight:800}
.f-vip{fill:#ffd866 !important;font-weight:800}.f-tra{fill:#ff8a8a !important;font-weight:800}
.f-red{fill:var(--e1) !important;font-weight:900}.f-yel{fill:var(--e3) !important;font-weight:900}.f-grn{fill:#5fd59a !important;font-weight:900}
.fl{fill:#0d1526}
.fl-occ{fill:#0e1628}
.fe1{fill:#2a1216}.fe2{fill:#2a1a10}.fe3{fill:#252110}.fe4{fill:#0f2219}.fe5{fill:#0f1c2c}
.fl-clean{fill:#0e1f1a}
.fl-dirty{fill:url(#hatch)}
.fl-cln{fill:#0e1e2e}
.fl-rsv{fill:#0d1f30}
.fl-closed{fill:#141a24}
.strf{stroke:#5d7096;stroke-width:1.5}
.wheel{fill:#5d7096}
.wall{fill:none;stroke:#8aa0c8;stroke-width:2.6;stroke-linecap:square}
.door{fill:none;stroke:#6b7fa6;stroke-width:1;stroke-dasharray:2 2}
.bed .frame{fill:#122a21;stroke:#3f8a66;stroke-width:1.5}
.bed .pillow{fill:#cfe8dc;opacity:.55}
.bed .blanket{fill:#2c6b50}
.bed .fold{stroke:#4f9d78;stroke-width:1.2}
.bed .rail{stroke:#3f8a66;stroke-width:1.5;stroke-linecap:round}
.chairbed .frame{fill:#16213a;stroke:#3a4c70}.chairbed .blanket{fill:#24365a}.chairbed .fold,.chairbed .rail{stroke:#3a4c70}.chairbed .pillow{fill:#8aa0c8;opacity:.4}
.desk{fill:#1a2744;stroke:#4e6187;stroke-width:1.5}
.desk-in{fill:#111a2d;stroke:#2c3d63}
.monitor{fill:#2f6f9a}
.table{fill:#1a2744;stroke:#3c4d73}
.chair{fill:#1c2842;stroke:#2a3a5c}
.slot{fill:none;stroke:#2a3a5c;stroke-dasharray:5 4}
.ct-ring{fill:#1a2744;stroke:#6b7fa6;stroke-width:2}.ct-hole{fill:#0b1222}.ct-table{fill:#3a4d75}
.bayline{stroke:#c9a227;stroke-width:1.5;stroke-dasharray:8 6;opacity:.6}
.arrow{fill:none;stroke:#5fd59a;stroke-width:2.5}
.entry{stroke:#5fd59a;stroke-width:6}
.amb-body{fill:#e4e9f1}.amb-cab{fill:#c9d2e0}.amb-win{fill:#3d5a86}.amb-stripe{fill:#d33a3f}.amb-light{fill:#e5484d}
.amb-t{font-family:var(--mono) !important;font-weight:800;fill:#1a2238 !important}
.amb-in{opacity:.6}.amb-in .amb-light{animation:blink .6s infinite}
@keyframes blink{50%{fill:#4c8dff}}
.hl{fill:transparent;stroke:transparent;stroke-width:3;pointer-events:all}
[data-room],[data-pt]{cursor:pointer}
.rm:hover .hl,.qp:hover .ring,.amb:hover .amb-body{stroke:#4cc3ff88}
.qp .ring{fill:transparent;stroke:transparent;stroke-width:2.5}
.qp.selected .ring,.qp.selected .hl,.amb.selected .amb-body{stroke:var(--accent);stroke-width:3}
.rm.selected .hl{stroke:var(--accent);stroke-width:3.5}
.rm.warnfit .hl{stroke:#e5484d99;stroke-width:2}
.rm.dimmed,.qp.dimmed{opacity:.38}
.rm.fit-good .hl{stroke:var(--good);fill:#30a46c22;stroke-width:3.5}
.rm.fit-fair .hl{stroke:var(--fair);fill:#f2a33a1c;stroke-width:3.5}
.rm.fit-poor .hl{stroke:var(--poor);fill:#e5484d1c;stroke-width:3.5}
.rm.fit-no{opacity:.3}
.fit-good .t-fit{fill:#7fe8ad !important}.fit-fair .t-fit{fill:#ffc56b !important}.fit-poor .t-fit{fill:#ff8f92 !important}.fit-no .t-fit{fill:#8496b8 !important}
.rm.rsv .hl{stroke:var(--accent);stroke-dasharray:6 4;stroke-width:2}
.rm.dirty .hl{stroke:#8a5a2b}
.dropzone{fill:#30a46c18;stroke:var(--good);stroke-width:2.5;stroke-dasharray:7 5;cursor:pointer}
@keyframes alarmS{50%{stroke:#e5484d;stroke-width:4}}
.rm.alarm .hl,.qp.alarm .ring,.qp.alarm .hl{animation:alarmS 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e5484d00}50%{box-shadow:0 0 0 3px #e5484daa}}
.qrow.alarm{animation:pulse 1.2s infinite}
.zone-target{outline:2px dashed var(--good);outline-offset:2px}

/* ---------- info ---------- */
.staff{display:flex;flex-direction:column;gap:4px;font-size:12px}
.staff .s{display:flex;gap:6px;align-items:baseline;justify-content:space-between;background:var(--panel2);border-radius:6px;padding:4px 7px}
.staff .s b{font-weight:600} .staff .s span{color:var(--muted);font-size:11px;text-align:right}
.staff .s.off{opacity:.45}
#log{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;font-size:11.5px}
#log div{padding:2px 4px;border-radius:4px;color:#b8c5da}
#log div time{font-family:var(--mono);color:var(--dim);margin-right:6px}
#log .good{color:#8de3b0} #log .warn{color:#ffcf80} #log .bad{color:#ff9fa1;background:#2a1315}

/* ---------- selection bar ---------- */
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#0f1a30f5;border-top:2px solid var(--accent);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none;backdrop-filter:blur(6px)}
#selbar.on{display:block}
.selin{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.selpt{display:flex;gap:8px;align-items:center;min-width:0;flex:1 1 260px}
.selpt .t{min-width:0}
.selpt .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selpt .t > span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selhint{font-size:12px;color:#cfe3ff;flex:1 1 260px}
.selhint .w{color:#ffc56b}
.selacts{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600}
.btn.pri{background:var(--accent);color:#04121c;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:14px;right:14px;z-index:40;display:flex;flex-direction:column;gap:6px;max-width:min(330px,calc(100vw - 20px));pointer-events:none}
.toast{background:#18243f;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px #0008;animation:tin .2s ease-out}
.toast.good{border-left-color:var(--good)} .toast.warn{border-left-color:var(--fair)} .toast.bad{border-left-color:var(--poor);background:#2a1418}
@keyframes tin{from{transform:translateY(6px);opacity:0}}
body.has-sel #toasts{bottom:120px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;background:#03070fcc;display:grid;place-items:center;padding:14px;overflow:auto}
#modal[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 60px #000a}
.card.wide{max-width:720px}
.card .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
.card.mci{border-color:var(--poor)} .card.mci .tag{color:var(--poor)}
.card h3{margin:4px 0 8px;font-size:20px}
.card p{color:#c3cfe3;line-height:1.5;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.opt b{display:block;font-size:14px}
.opt span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.opt:hover{border-color:var(--accent)}
.opt.tog.on{border-color:var(--good);background:#11291d}
.opt.tog b::before{content:"☐ ";color:var(--muted)} .opt.tog.on b::before{content:"☑ ";color:var(--good)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.diffs .opt.on{border-color:var(--accent);background:#10253a}
.how{margin:0;padding-left:18px;color:#c3cfe3;line-height:1.55;font-size:13px}
.how li{margin:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;font-size:11px;color:var(--muted);align-items:center}
.gradebig{display:flex;align-items:center;gap:16px;margin:6px 0 12px}
.gradebig .g{font-size:64px;font-weight:900;font-family:var(--mono);line-height:1;color:var(--accent)}
.gradebig .sc{font-size:14px;color:var(--muted)}
.gradebig .sc b{font-size:22px;color:var(--text);display:block}
table.bd{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
table.bd td{padding:5px 4px;border-bottom:1px solid var(--line)}
table.bd td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
table.bd tr.neg td:last-child{color:#ff9fa1} table.bd tr.pos td:last-child{color:#8de3b0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:8px 0}
.statgrid div{background:var(--panel2);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted)}
.statgrid div b{display:block;font-size:17px;color:var(--text);font-family:var(--mono)}
.notes{font-size:12.5px;color:#c3cfe3;padding-left:18px;margin:6px 0}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  #layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "map" "info"}
  #side .panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  #side .qsec + .qsec{margin-top:0}
}
@media (max-width:820px){
  #layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "map" "info";padding:8px;gap:8px}
  #map{padding:3px;border-radius:10px}
  .metrics{justify-content:flex-start;order:5;flex-basis:100%}
  #toasts{bottom:10px;left:10px;right:10px;max-width:none}
  body.has-sel #toasts{bottom:150px}
  .toast{padding:6px 9px;font-size:12px}
  #top{padding:6px 10px;gap:6px 10px}
  .metrics{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .metrics::-webkit-scrollbar{display:none}
  .iconbtn .lbl{display:none}
  .clock{font-size:20px}
  .qlist{max-height:none}
}
@media (max-width:420px){
  .diffs{grid-template-columns:1fr}
  .brand small{display:none}
}
</style>
</head>
<body>
<header id="top">
  <div class="brand">Bed Board<small>ED bed manager · day shift</small></div>
  <div class="clock" id="clock">07:00<small id="clocksub">SHIFT 07–19</small></div>
  <div class="speeds" id="speeds">
    <button data-speed="0" title="Pause (Space)">❚❚</button>
    <button data-speed="1" title="Normal (1)">1×</button>
    <button data-speed="2" title="Fast (2)">2×</button>
    <button data-speed="4" title="Faster (3)">4×</button>
  </div>
  <button class="iconbtn" data-act="help" title="How to play">?<span class="lbl"> Help</span></button>
  <div class="metrics" id="metrics"></div>
</header>

<main id="layout">
  <section id="side"></section>
  <section id="map"></section>
  <section id="info">
    <div class="panel" style="margin-bottom:10px"><h2>Staff on duty</h2><div class="staff" id="staff"></div></div>
    <div class="panel"><h2>Shift log</h2><div id="log"></div></div>
  </section>
</main>

<div id="selbar"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SHIFT_START = 7 * 60, SHIFT_END = 19 * 60;
const fmtClock = t => String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
const fmtDur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60); return h ? h + 'h' + String(m % 60).padStart(2, '0') : m + 'm'; };

/* ================= static data ================= */
const AREAS = [

/* ================= state ================= */
let S = null;
const P = id => S.pts.find(p => p.id === id);
const R = id => S.rooms[id];

function newGame(diffKey) {
  const diff = DIFFS[diffKey] || DIFFS.typical;
  S = {
    t: SHIFT_START, speed: 0, acc: 0, diffKey, diff, pid: 0,
    rooms: {}, pts: [], sel: null, log: [], mods: [], surge: false, ended: false, modal: null,

}

/* ================= patients ================= */
function genPatient(mode, o = {}) {
  let kind = o.kind;
  if (!kind) { const r = Math.random(); kind = r < (mode === 'walk' ? 0.15 : 0.07) ? 'peds' : r < (mode === 'walk' ? 0.22 : 0.14) ? 'psych' : 'adult'; }
  let esi = o.esi;
  if (!esi) {
    const dist = mode === 'walk' ? [0.01, 0.12, 0.42, 0.33, 0.12] : [0.07, 0.32, 0.45, 0.14, 0.02];
    let r = Math.random(); esi = 1; for (let i = 0; i < 5; i++) { if (r < dist[i]) { esi = i + 1; break; } r -= dist[i]; esi = i + 2; }
    esi = clamp(esi, 1, 5);
    if (kind === 'psych') esi = chance(0.4) ? 2 : 3;
  }
  const pool = CC[kind][esi] || CC[kind][3] || CC.adult[esi];
  const [cc, fl] = o.cc ? [o.cc, o.trauma ? 'T' : ''] : pick(pool);
  const sex = chance(0.5) ? 'F' : 'M';
  let age;
  if (kind === 'peds') age = pick([0, 1, 2, 3, 4, 6, 8, 10, 12, 14, 16, 17]);
  else if (kind === 'psych') age = ri(19, 62);
  else age = esi <= 2 ? ri(38, 92) : ri(19, 84);
  const p = {
    id: ++S.pid, mode, kind, esi, cc, age, sex, trauma: fl === 'T', psych: kind === 'psych', peds: kind === 'peds',
    first: pick(sex === 'F' ? FIRST_F : FIRST_M), last: pick(LAST),
    arrive: S.t, emsAt: null, loc: mode === 'walk' ? 'waiting' : 'incoming', room: null, rsv: null, phase: 'arrived',
    timer: 0, tests: [], md: null, seenAt: null, roomedAt: null, resAt: null, dispo: null, dispoAt: null, unit: null,
    complained: false, lastAdverse: -999, sitter: false, calm: false, vip: false, mci: o.mci || null, handoffRisk: false,
  };
  return p;
}
function setAgeLabel(p) { p.ageLabel = p.age === 0 ? ri(2, 11) + 'mo ' + p.sex : p.age + p.sex; }

function addWalkIn(o) {
  const p = genPatient('walk', o); setAgeLabel(p);
  S.pts.push(p); S.st.arrivals++;
  log(`Walk-in: ${p.ageLabel} ${p.cc} — triaged ESI ${p.esi}`, p.esi <= 2 ? 'warn' : 'info');
  if (p.esi <= 2) toast(`Triage: ESI ${p.esi} in the waiting room — ${p.ageLabel} ${p.cc}`, 'warn');
  return p;
}
function radioEMS(o = {}, eta) {
  const p = genPatient(o.mci ? 'mci' : 'ems', o); setAgeLabel(p);
  p.eta = S.t + (eta ?? ri(6, 14));
  S.pts.push(p);
  if (!o.mci) {
    log(`EMS radio: ${p.ageLabel} ${p.cc}, ESI ${p.esi}, ETA ${p.eta - S.t}m`, p.esi <= 2 ? 'warn' : 'info');
    if (p.esi <= 2) toast(`🚑 EMS radio: ${p.ageLabel} ${p.cc} (ESI ${p.esi}), ETA ${p.eta - S.t} min`, p.esi === 1 ? 'bad' : 'warn');
  }
  return p;
}
function emsArrive(p) {
  p.arrive = S.t; p.emsAt = S.t; S.st.arrivals++; if (p.mci) S.st.mciPts++;
  if ((p.esi === 1 || p.trauma && p.esi <= 2) && !p.rsv) {
    const bays = ['T1', 'T2'].map(R);
    const free = bays.some(r => r.state === 'clean' && !r.pt && !r.rsv);
    const blocked = bays.some(r => r.pt && P(r.pt) && P(r.pt).esi >= 3);
    if (!free && blocked) { S.st.resusBlocked++; log(`Resus bays full of low-acuity patients when a critical patient arrived`, 'bad'); moment('Critical arrival found both resus bays blocked'); }
  }
  if (p.rsv && R(p.rsv) && R(p.rsv).rsv === p.id && R(p.rsv).state === 'clean' && !R(p.rsv).pt) {
    const r = R(p.rsv); r.rsv = null; p.rsv = null; p.loc = 'ems'; placeInRoom(p, r);
    log(`EMS arrived: ${name(p)} straight to ${r.id} (pre-assigned)`, 'good');
  } else {
    if (p.rsv && R(p.rsv)) R(p.rsv).rsv = null;
    p.rsv = null; p.loc = 'ems';
    log(`EMS arrived: ${name(p)} ${p.cc} — on the stretcher, needs a bed`, p.esi <= 2 ? 'warn' : 'info');
    if (p.esi <= 2 && !p.mci) toast(`🚑 ${name(p)} (ESI ${p.esi}) is on the EMS stretcher — needs a room`, p.esi === 1 ? 'bad' : 'warn');
  }
}
const name = p => `${p.last}, ${p.first[0]}`;

function seedBoard() {
  const put = (roomId, o, setup) => {
    const p = genPatient(o.mode || 'walk', {kind:'adult', ...o}); setAgeLabel(p);
    p.arrive = S.t - (o.ago || ri(60, 240)); p.seenAt = p.arrive + ri(15, 45); p.roomedAt = p.arrive + 10;
    p.md = pick(['ALV', 'BRE', 'NGT']); S.pts.push(p);
    if (roomId) { const r = R(roomId); r.pt = p.id; r.state = 'occ'; p.loc = 'room'; p.room = roomId; }
    setup(p); return p;
  };
  put('A2', {esi:2, ago:380}, p => { p.phase = 'admit'; p.dispo = 'admit'; p.unit = 'Tele'; p.timer = ri(30, 80); p.dispoAt = S.t - 120; });
  put('B5', {esi:2, ago:520}, p => { p.phase = 'admit'; p.dispo = 'admit'; p.unit = 'Med'; p.timer = ri(120, 220); p.dispoAt = S.t - 300; });
  put('H1', {esi:3, ago:640}, p => { p.phase = 'admit'; p.dispo = 'admit'; p.unit = 'Med'; p.timer = ri(160, 260); p.dispoAt = S.t - 400; });
  put('O1', {esi:3, ago:600}, p => { p.phase = 'inObs'; p.dispo = 'obs'; p.timer = ri(50, 120); });
  put('O2', {esi:3, ago:420}, p => { p.phase = 'inObs'; p.dispo = 'obs'; p.timer = ri(180, 280); });
  put('A5', {esi:3, ago:110}, p => { p.phase = 'tests'; p.tests = ['LAB', 'CT']; p.timer = ri(15, 35); });
  put('B1', {esi:3, ago:190}, p => { p.phase = 'results'; p.resAt = S.t - 5; });
  put('B3', {esi:2, ago:80, mode:'ems'}, p => { p.phase = 'tests'; p.tests = ['LAB', 'XR']; p.timer = ri(20, 45); });
  put('A6', {esi:3, ago:35}, p => { p.phase = 'awaitMD'; p.seenAt = null; p.md = null; p.roomedAt = S.t - 12; });
  put('F2', {esi:4, ago:75}, p => { p.phase = 'dc'; p.dispo = 'dc'; p.timer = ri(5, 15); });
  put('F4', {esi:4, ago:40}, p => { p.phase = 'tests'; p.tests = ['XR']; p.timer = ri(10, 25); });
  put('P2', {esi:3, kind:'peds', ago:95}, p => { p.phase = 'tests'; p.tests = ['UA']; p.timer = ri(15, 30); });
  put('BH1', {esi:3, kind:'psych', ago:300}, p => { p.phase = 'consult'; p.tests = []; p.timer = ri(40, 90); });
  put('BH2', {esi:2, kind:'psych', ago:900}, p => { p.phase = 'admit'; p.dispo = 'transfer'; p.unit = 'Psych facility'; p.timer = ri(200, 380); });
  for (const id of ['T1', 'A7', 'O4', 'H3']) { R(id).state = 'dirty'; R(id).req = true; S.evsQ.push(id); }
  // waiting room & stretcher
  for (const [esi, ago] of [[3, 38], [4, 26], [3, 12], [5, 8]]) { const p = genPatient('walk', {esi, kind:'adult'}); setAgeLabel(p); p.arrive = S.t - ago; S.pts.push(p); }
  const e = genPatient('ems', {esi:3, kind:'adult'}); setAgeLabel(e); e.arrive = e.emsAt = S.t - 9; e.loc = 'ems'; S.pts.push(e);
  radioEMS({esi:2, kind:'adult', cc:'Chest pain'}, 7);
  log('Report from the night charge nurse: 14 patients in rooms, 4 in the waiting room, 1 on an EMS stretcher, 4 rooms dirty.', 'info');
}

/* ================= placement fit ================= */
function fitType(p, type) {
  if (type === 'obs') return p.phase === 'obs' || p.phase === 'inObs' ? {lvl:'good', why:'Observation bed'} : {lvl:'no', why:'Obs unit only accepts patients the doctor has placed in observation'};
  if (type === 'fast' && modOn('ftAcute')) type = 'acute';
  const e = p.esi, kid = p.peds, psy = p.psych;
  const settled = ['dc', 'transport'].includes(p.phase);
  switch (type) {
    case 'trauma':
      if (e === 1) return {lvl:'good', why:'Resus bay'};
      if (e === 2) return {lvl:p.trauma ? 'good' : 'fair', why:p.trauma ? 'Trauma bay' : 'OK, but ties up a resus bay', risk:null};
      return {lvl:'poor', why:'Low-acuity patient blocking a resus bay', risk:'resus'};
    case 'acute':
      if (psy) return {lvl:'fair', why:'Not ligature-safe — needs a sitter', risk:'psych'};
      if (e === 1 && p.trauma) return {lvl:'fair', why:'Major trauma belongs in a resus bay'};
      if (e === 1) return {lvl:'fair', why:'Critical — resus bay preferred'};
      if (kid) return {lvl:'fair', why:'Child in an adult room', risk:'complaint'};
      if (e >= 4) return {lvl:'fair', why:'Monitored bed used for a minor complaint'};
      return {lvl:'good', why:'Monitored acute room'};
    case 'hall': case 'surge':
      if (e <= 2 && !settled) return {lvl:'poor', why:'Unmonitored hallway — unsafe for this acuity', risk:'det'};
      if (psy) return {lvl:'poor', why:'Psych patient in an open hallway', risk:'psych'};
      if (kid) return {lvl:'fair', why:'Child in an adult hallway', risk:'complaint'};
      if (e === 3) return {lvl:'fair', why:'Hallway OK for a stable ESI 3', risk:'complaint'};
      return {lvl:'good', why:'Hallway bed fine for low acuity', risk:'complaint'};
    case 'fast':
      if (e <= 2 && !settled) return {lvl:'poor', why:'Fast track has no monitors', risk:'det'};
      if (psy) return {lvl:'poor', why:'Psych patient in fast track', risk:'psych'};
      if (e === 3) return {lvl:'fair', why:'ESI 3 may be too sick for fast track'};
      return {lvl:'good', why:'Fast track'};
    case 'peds':
      if (!kid) return {lvl:'poor', why:'Adult in the pediatric area', risk:'complaint'};
      if (e === 1) return {lvl:'fair', why:'Critical child — resus bay preferred'};
      return {lvl:'good', why:'Pediatric room'};
    case 'bh':
      if (psy) return {lvl:'good', why:'Safe room'};
      if (e <= 3) return {lvl:'poor', why:'BH rooms have no monitors or equipment', risk:'det'};
      return {lvl:'fair', why:'BH room used for a medical patient'};
  }
  return {lvl:'fair', why:''};
}
function fit(p, room) {
  if (room.closedUntil > S.t && room.pt !== p.id) return {lvl:'no', why:'Room closed (no nurse)'};
  return fitType(p, room.type);
}
const canResultsWait = p => p.seenAt != null && p.esi >= 3 && !p.psych && !['eval', 'reval', 'inObs'].includes(p.phase) && p.loc === 'room' && p.age >= 1;

/* ================= movement ================= */
function vacate(p) {
  if (p.loc === 'room' && p.room) {
    const r = R(p.room);
    if (r && r.pt === p.id) { r.pt = null; r.state = 'dirty'; r.req = true; S.evsQ.push(r.id); }
  }
  p.room = null;
}
function placeInRoom(p, r) {
  vacate(p);
  r.pt = p.id; r.state = 'occ'; r.rsv = null;
  p.loc = 'room'; p.room = r.id;
  if (p.phase === 'arrived') { p.phase = 'awaitMD'; p.roomedAt = S.t; }
  if (r.type === 'obs' && p.phase === 'obs') { p.phase = 'inObs'; p.timer = ri(200, 380); S.st.obsIn++; log(`${name(p)} moved to observation (${r.id})`, 'good'); }
}
function depart(p, how) {
  vacate(p);
  if (p.rsv && R(p.rsv)) R(p.rsv).rsv = null;
  S.pts = S.pts.filter(x => x !== p);
  if (S.sel === p.id) S.sel = null;
  for (const d of S.docs) if (d.pt === p.id) { d.pt = null; d.busy = 0; d.task = null; }
  const los = S.t - p.arrive;
  switch (how) {
    case 'dc': S.st.dc++; S.st.losDc.push(los); log(`${name(p)} discharged home (LOS ${fmtDur(los)})`, 'good'); break;
    case 'obsdc': S.st.dc++; log(`${name(p)} discharged from obs`, 'good'); break;
    case 'admit':
      if (p.dispo === 'transfer') { S.st.transfer++; log(`${name(p)} transferred to ${p.unit}`, 'good'); }
      else { S.st.admit++; log(`${name(p)} went up to ${p.unit}`, 'good'); }
      if (p.handoffRisk && chance(0.2)) { S.st.safety++; log(`Handoff gap: ${p.unit} reports a missed med for ${name(p)} after the rushed report`, 'bad'); moment('Rushed handoff led to a missed medication upstairs'); }
      break;
    case 'lwbs': S.st.lwbs++; log(`${name(p)} (ESI ${p.esi}) left without being seen after ${fmtDur(los)}`, 'bad'); toast(`${name(p)} left without being seen (${fmtDur(los)} wait)`, 'bad'); break;
    case 'elope': S.st.elope++; break;
  }
}

/* ================= modifiers ================= */
const addMod = (k, v, dur) => S.mods.push({k, v, until:S.t + dur});
const modOn = k => S.mods.some(m => m.k === k && m.until > S.t);
const modMul = k => S.mods.filter(m => m.k === k && m.until > S.t).reduce((a, m) => a * m.v, 1);
const modSum = k => S.mods.filter(m => m.k === k && m.until > S.t).reduce((a, m) => a + m.v, 0);

/* ================= EVS ================= */
const evsCrews = () => clamp(2 + modSum('evsAdd'), 1, 5);
function requestEVS(r) {
  if (r.state !== 'dirty') return;
  const i = S.evsQ.indexOf(r.id);
  if (i < 0) { r.req = true; S.evsQ.unshift(r.id); }
  else if (i > 0) { S.evsQ.splice(i, 1); S.evsQ.unshift(r.id); toast(`${r.id} bumped to STAT — the next free EVS crew takes it`, 'info'); log(`${r.id} made STAT clean`, 'info'); }
  else toast(`${r.id} is already next for EVS`, 'info');
}
function evsTick() {
  const rooms = Object.values(S.rooms);
  for (const r of rooms) if (r.state === 'cleaning' && --r.timer <= 0) { r.state = 'clean'; r.timer = 0; }
  let active = rooms.filter(r => r.state === 'cleaning').length;
  while (active < evsCrews() && S.evsQ.length) {
    const r = R(S.evsQ.shift());
    if (!r || r.state !== 'dirty') continue;
    r.state = 'cleaning'; r.req = false;
    r.timer = r.timerMax = Math.round((r.type === 'trauma' ? ri(18, 28) : ri(11, 19)) * modMul('cleanMult'));
    active++;
  }
}

/* ================= providers ================= */
const onDuty = d => S.t >= d.start && S.t < d.end;
function providerTick() {
  // ESI 1 patients get a physician immediately — interrupt whoever isn't with a critical patient
  for (const p of S.pts) {
    if (p.esi === 1 && p.phase === 'awaitMD' && p.loc === 'room' && !S.docs.some(d => d.pt === p.id)) {
      const mds = S.docs.filter(d => onDuty(d) && !d.app && !(d.pt && P(d.pt) && P(d.pt).esi === 1));
      if (!mds.length) continue;
      const d = mds.sort((a, b) => a.busy - b.busy)[0];
      if (d.pt) { const q = P(d.pt); if (q) q.phase = d.task === 'eval' ? 'awaitMD' : 'results'; }
      startTask(d, p);
    }
  }
  for (const d of S.docs) {
    if (!onDuty(d)) {
      if (d.pt) { const q = P(d.pt); if (q) q.phase = d.task === 'eval' ? 'awaitMD' : 'results'; d.pt = null; d.task = null; d.busy = 0; }
      continue;
    }
    if (d.pt) { if (--d.busy <= 0) finishTask(d); continue; }
    const appOn = S.docs.some(x => x.app && onDuty(x));
    let best = null, bestPr = -1e9;
    for (const p of S.pts) {
      const needs = (p.phase === 'awaitMD' && p.loc === 'room') || (p.phase === 'results' && (p.loc === 'room' || p.loc === 'results'));
      if (!needs || S.docs.some(x => x.pt === p.id)) continue;
      const fastRoom = p.loc === 'room' && R(p.room).type === 'fast';
      if (d.app && !(p.esi >= 4 || (fastRoom && p.esi === 3)) ) continue;
      if (d.app && p.psych) continue;
      const since = S.t - (p.phase === 'awaitMD' ? p.roomedAt : p.resAt);
      let pr = (6 - p.esi) * 25 + since * 0.7 + (p.phase === 'results' ? 12 : 0);
      if (p.esi === 1) pr += 500;
      if (p.vip) pr += 60;
      if (!d.app && appOn && p.esi >= 4 && since < 45) pr -= 90;
      if (d.app && fastRoom) pr += 20;
      if (pr > bestPr) { bestPr = pr; best = p; }
    }
    if (best) startTask(d, best);
  }
}
function startTask(d, p) {
  d.pt = p.id; p.md = d.short;
  const mult = modMul('evalMult');
  if (p.phase === 'awaitMD') {
    d.task = 'eval'; p.phase = 'eval';

function orderTests(p) {

  else if (e === 4) { if (chance(0.6)) { tests = [pick(['XR', 'XR', 'UA', 'LAB'])]; dur = ri(30, 60); } }
  else if (e === 3) { tests = ['LAB', pick(['CT', 'XR', 'US', 'CT'])]; dur = ri(60, 130); }
  else if (e === 2) { tests = ['LAB', pick(['CT', 'CT', 'XR', 'ECHO', 'CTA'])]; dur = ri(55, 115); }
  else { tests = ['LAB', 'CT']; dur = ri(35, 70); }

}

    log(`${p.md ? 'Dr ' + p.md : 'MD'}: ${name(p)} — ${kind === 'transfer' ? 'transfer to' : 'admit to'} ${unit}`, 'info'); };
  if (p.psych) { if (r < 0.55) return admit('Psych facility', 'transfer'); }
  else if (p.trauma && e === 1 && chance(0.5)) return admit('OR');

    const ap = [0, 0.88, 0.55, 0.24, 0.04, 0][e], op = p.peds ? 0 : [0, 0, 0.14, 0.18, 0.05, 0][e];

/* ================= per-patient tick ================= */

    case 'consult': if (--p.timer <= 0) { p.consulted = true; p.phase = 'results'; p.resAt = S.t; } break;
    case 'dc': if (--p.timer <= 0) { depart(p, 'dc'); return; } break;
    case 'admit': if (--p.timer <= 0) { p.phase = 'transport'; p.timer = ri(10, 22); if (p.loc === 'room') log(`Bed ready for ${name(p)} (${p.unit}) — transport called`, 'good'); } break;

    }

    else if (p.esi === 2 && w >= 20 && chance(0.006 * rm)) { adverse(p, 'decompensated while waiting for a bed'); p.esi = 1; }
    else if (p.esi === 3 && w >= 90 && chance(0.0015 * rm)) { p.esi = 2; log(`${name(p)} worsened in the waiting room — re-triaged ESI 2`, 'warn'); }
    if (p.psych && !p.sitter && w >= 30 && chance(0.004 * rm)) { psychEvent(p); return; }

function scoreCard() {
  const s = S.st, L = [];
  const add = (label, detail, pts) => { if (Math.abs(pts) >= 0.05) L.push({label, detail, pts}); };
  const d2p = avg(s.d2p);
  add('Adverse events', `${s.adverse} patient${s.adverse === 1 ? '' : 's'} harmed by delays or the wrong space`, -7 * s.adverse);
  add('Safety events', `${s.safety} (elopements, violence, handoff errors)`, -4 * s.safety);
  add('Left without being seen', `${s.lwbs} patients walked out`, -Math.min(20, 2 * s.lwbs));
  add('EMS offload delays', `${s.emsDelay} times a crew was stuck 30+ min`, -Math.min(20, 2 * s.emsDelay));
  add('Resus bays blocked', `${s.resusBlocked} critical arrivals found no open bay`, -3 * s.resusBlocked);
  add('Complaints', `${s.complaints} filed`, -1 * s.complaints);
  if (d2p > 20) add('Door-to-provider time', `average ${Math.round(d2p)} min (target ≤ 20)`, -Math.min(20, (d2p - 20) * 0.35));
  add('Patients in the wrong space', `${fmtDur(s.poorMin)} of poor-fit placements`, -Math.min(15, s.poorMin / 45));
  add('Overtime and surge spending', `$${s.budget.toFixed(1)}k`, -Math.min(8, s.budget * 0.3));
  add('Ambulance diversion', fmtDur(s.divMin), -Math.min(8, s.divMin / 30));
  add('Skipped triage order', `${s.bypass} VIP bump`, -2 * s.bypass);
  add('Accepted outside transfers', `${s.transferAccepted}`, 2 * s.transferAccepted);
  const thr = s.dc + s.admit + s.transfer + s.obsIn;
  add('Throughput', `${thr} patients dispositioned or moved to obs`, Math.min(8, thr / 10));
  const total = clamp(Math.round(100 + L.reduce((a, l) => a + l.pts, 0)), 0, 100);
  const g = total >= 97 ? 'A+' : total >= 90 ? 'A' : total >= 85 ? 'B+' : total >= 80 ? 'B' : total >= 75 ? 'C+' : total >= 70 ? 'C' : total >= 60 ? 'D' : 'F';

}

    o += surgeOff ? zoneLabel({...z, label:'STAFF CONFERENCE', area:null}) : zoneLabel(z);
    if (surgeOff) {
      const cx = z.x + z.w / 2, cy = z.y + z.h / 2 + 10;
      o += `<rect x="${r1(cx - 60)}" y="${r1(cy - 22)}" width="120" height="44" rx="20" class="table"/>` +
        [-45, -15, 15, 45].map(dx => `<circle cx="${r1(cx + dx)}" cy="${r1(cy - 32)}" r="7" class="chair"/><circle cx="${r1(cx + dx)}" cy="${r1(cy + 32)}" r="7" class="chair"/>`).join('') +
        `<text x="${r1(cx)}" y="${r1(cy + 4)}" text-anchor="middle" class="t-mut" font-size="10">opens as surge space in an MCI</text>`;
    }
  }
  if (L.corrLabel) o += `<text x="${L.corrLabel.x}" y="${L.corrLabel.y}" text-anchor="middle" class="t-corr">MAIN CORRIDOR</text>`;
  // CT
  if (L.ct) {
    const C = L.ct, ctq = S.pts.filter(p => p.phase === 'tests' && p.tests.some(t => t === 'CT' || t === 'CTA')).length, cx = C.x + C.w / 2, cy = C.y + C.h / 2 + 8;
    o += `<circle cx="${r1(cx)}" cy="${r1(cy)}" r="26" class="ct-ring"/><circle cx="${r1(cx)}" cy="${r1(cy)}" r="12" class="ct-hole"/><rect x="${r1(cx - 6)}" y="${r1(cy - 4)}" width="${r1(Math.min(70, C.w / 2 - 6))}" height="8" rx="3" class="ct-table"/>
      <text x="${r1(C.x + C.w - 8)}" y="${r1(C.y + 16)}" text-anchor="end" class="t-mut" font-size="10.5">${ctq ? ctq + ' scan' + (ctq > 1 ? 's' : '') + ' pending' : 'idle'}${modOn('ctAdd') ? ' · DOWN' : ''}</text>`;
  }
  if (L.triage) for (const t of L.triage) o += `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" class="fl"/>${walls(t)}<text x="${r1(t.x + t.w / 2)}" y="${r1(t.y + 20)}" text-anchor="middle" class="t-mut" font-size="10">${t.label}</text>${bedIcon(t.x + t.w / 2, t.y + t.h / 2 + 8, 0.7, 'bed chairbed')}`;
  if (L.reg) o += `<rect x="${L.reg.x}" y="${L.reg.y}" width="${L.reg.w}" height="${L.reg.h}" rx="6" class="desk"/><text x="${r1(L.reg.x + L.reg.w / 2)}" y="${r1(L.reg.y + 17)}" text-anchor="middle" class="t-stn" font-size="10">REGISTRATION</text>`;
  if (L.entry) o += `<path d="M${L.entry.x} ${L.entry.y}V${L.entry.y + L.entry.len}" class="entry"/>`;
  for (const d of L.decor) if (d.kind === 'desk') o += `<rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="12" class="desk"/><text x="${r1(d.x + d.w / 2)}" y="${r1(d.y + d.h / 2)}" text-anchor="middle" class="t-stn" font-size="10.5">${d.label}</text><text x="${r1(d.x + d.w / 2)}" y="${r1(d.y + d.h / 2 + 14)}" text-anchor="middle" class="t-mut" font-size="9.5">${d.sub}</text>`;
  for (const s of L.stations) o += stationSVG(s);
  // queues on the map
  if (L.ems) o += emsSVG(L.ems);
  if (L.wait) {
    const w = S.pts.filter(p => p.loc === 'waiting').sort((a, b) => a.esi - b.esi || a.arrive - b.arrive);
    o += chairsSVG(L.wait, w, p => { const m = S.t - p.arrive; return [fmtDur(m), waitCls(m, p.esi <= 2 ? 10 : 45, p.esi <= 2 ? 20 : 90)]; });
  }
  if (L.results) {
    const rs = S.pts.filter(p => p.loc === 'results').sort((a, b) => a.arrive - b.arrive);
    o += chairsSVG(L.results, rs, p => [p.phase === 'dc' ? 'D/C' : p.phase === 'tests' ? 'tests' : p.phase === 'results' ? 'ready' : p.phase === 'admit' ? 'ADM' : '', '']);
    if (sel && sel.loc === 'room' && canResultsWait(sel)) o += `<rect x="${L.results.x - 6}" y="${L.results.y - 4}" width="${L.results.w + 12}" height="${L.results.h + 8}" rx="8" class="dropzone" data-zone="results"/>`;
  }
  // rooms
  for (const a of AREAS) {
    if (a.hidden && !S.surge) continue;
    for (const id of a.rooms) if (L.rooms[id]) o += roomSVG(R(id), L.rooms[id]);
  }
  o += `</svg>`;
  $('#map').innerHTML = o;
}
function zoneLabel(z) {
  let t = `<text x="${z.x + 8}" y="${z.y + 15}" class="t-zl">${z.label}</text>`;
  if (z.area && (!AREA_BY_ID[z.area].hidden || S.surge)) {
    const rooms = AREA_BY_ID[z.area].rooms.map(R);
    const occ = rooms.filter(r => r.pt).length;
    const ready = rooms.filter(r => r.state === 'clean' && !r.pt && !r.rsv && !(r.closedUntil > S.t)).length;
    const note = z.area === 'fast' && modOn('ftAcute') ? ' · ACUTE (surge)' : '';
    t += `<text x="${z.x + z.w - 8}" y="${z.y + 15}" text-anchor="end" class="t-zc"><tspan class="t-mut">${occ}/${rooms.length}${note}</tspan>${ready ? `<tspan class="t-ready"> · ${ready} ready</tspan>` : ''}</text>`;
  }
  return t;
}

function renderInfo() {
  const docs = S.docs.map(d => {
    const on = onDuty(d), p = d.pt && P(d.pt);
    const what = !on ? (S.t < d.start ? `starts ${fmtClock(d.start)}` : 'off') : p ? `${d.task === 'eval' ? 'evaluating' : 'dispo'} ${name(p)}${p.room ? ' · ' + p.room : ''} (${d.busy}m)` : 'available';
    return `<div class="s ${on ? '' : 'off'}"><b>${esc(d.name)}</b><span>${esc(what)}</span></div>`;
  }).join('');
  const cleaning = Object.values(S.rooms).filter(r => r.state === 'cleaning');
  const evs = `<div class="s"><b>EVS · ${evsCrews()} crew${evsCrews() > 1 ? 's' : ''}</b><span>${cleaning.map(r => `${r.id} ${r.timer}m`).join(', ') || 'idle'}${S.evsQ.length ? ' · queue: ' + S.evsQ.join(', ') : ''}</span></div>`;
  const mods = [];
  if (modOn('diversion')) mods.push('Ambulance diversion');
  if (modOn('ftAcute')) mods.push('Fast track = acute');
  if (modOn('testAdd') || modOn('testAddLow')) mods.push('Lab delays');
  if (modOn('ctAdd')) mods.push('CT delays');
  if (modOn('bedMult')) mods.push('Electives cancelled');
  if (modOn('evalMult')) mods.push('Short-staffed');
  $('#staff').innerHTML = docs + evs + (mods.length ? `<div class="s"><b>Active</b><span>${mods.join(' · ')}</span></div>` : '');
  $('#log').innerHTML = S.log.slice(0, 60).map(l => `<div class="${l.kind}"><time>${fmtClock(l.t)}</time>${esc(l.msg)}</div>`).join('');
}
function renderSel() {
  const bar = $('#selbar'), p = S.sel && P(S.sel);
  document.body.classList.toggle('has-sel', !!p);
  if (!p) { bar.classList.remove('on'); bar.innerHTML = ''; return; }
  bar.classList.add('on');
  const where = p.loc === 'room' ? `in ${p.room}` : {waiting:'in the waiting room', ems:'on an EMS stretcher', incoming:`EMS inbound, ETA ${p.eta - S.t}m`, results:'in results waiting'}[p.loc];
  let hint = '';
  if (p.loc === 'incoming') hint = p.rsv ? `Reserved ${p.rsv}. Tap another room to change it.` : 'Tap a ready room to pre-assign it for arrival.';
  else if (p.loc === 'room') hint = 'Tap a ready room to move this patient. The old room will need cleaning.';
  else hint = 'Tap a highlighted ready room to place this patient.';
  const needs = [];
  if (p.esi === 1) needs.push('needs a resus bay now');
  else if (p.esi === 2 && !p.psych && !['dc', 'admit', 'transport'].includes(p.phase)) needs.push('needs a monitored bed');
  if (p.psych) needs.push('safe room or sitter');
  if (p.peds) needs.push('pediatric area');
  if (p.phase === 'obs') needs.push('obs unit bed');
  const acts = [];
  if (p.loc === 'room') acts.push(`<button class="btn" data-act="toResults" ${canResultsWait(p) ? '' : 'disabled title="Only seen, stable ESI 3–5 adults can wait in chairs"'}>To results waiting</button>`);
  if (p.loc === 'ems') acts.push(`<button class="btn" data-act="toWaiting" ${p.esi >= 3 && !p.psych ? '' : 'disabled title="Too sick for the waiting room"'}>Triage to waiting room</button>`);
  if (p.loc === 'incoming' && p.rsv) acts.push(`<button class="btn" data-act="unreserve">Release ${p.rsv}</button>`);
  acts.push(`<button class="btn ghost" data-act="deselect">Done</button>`);
  const [st] = status(p);
  bar.innerHTML = `<div class="selin">
    <div class="selpt"><span class="esi e${p.esi}" style="width:28px;height:28px;font-size:15px">${p.esi}</span><div class="t"><b>${esc(p.first + ' ' + p.last)} · ${p.ageLabel} ${flags(p)}</b><span>${esc(p.cc)} · ${esc(where)}${p.loc !== 'incoming' ? ' · ' + esc(st) : ''}</span></div></div>
    <div class="selhint">${esc(hint)}${needs.length ? `<br><span class="w">Needs: ${esc(needs.join(', '))}</span>` : ''}</div>
    <div class="selacts">${acts.join('')}</div></div>`;
}
function render() {
  if (!S) return;
  renderTop(); renderSide(); renderMap(); renderInfo(); renderSel();
}

/* ================= interaction ================= */
const narrow = () => innerWidth <= 820;
function select(id) {
  S.sel = S.sel === id ? null : id; render();
  const p = S.sel && P(S.sel);
  if (p && narrow() && p.loc !== 'room') {
    const t = document.querySelector('.rm.fit-good') || document.querySelector('.rm.fit-fair') || document.querySelector('.rm.fit-poor');
    if (t) t.scrollIntoView({block:'center', behavior:'smooth'});
  }
}
function roomClick(id) {
  if (S.ended) return;
  const r = R(id), sel = S.sel && P(S.sel);
  if (r.state === 'dirty') { requestEVS(r); render(); return; }
  if (r.state === 'cleaning') { toast(`${r.id} is being cleaned — ready in ${r.timer} min`); return; }
  if (r.pt) { select(r.pt); return; }
  if (r.rsv && (!sel || sel.id !== r.rsv)) { select(r.rsv); return; }
  if (!sel) { toast('Pick a patient first (waiting room, stretcher, or a room), then tap a ready room.'); return; }
  if (sel.room === r.id) return;
  if (sel.phase === 'inObs') { toast(`${name(sel)} is in observation — they'll leave from the obs unit`, 'warn'); return; }
  const f = fit(sel, r);
  if (f.lvl === 'no') { toast(f.why, 'warn'); return; }
  if (sel.loc === 'incoming') {
    if (sel.rsv && R(sel.rsv)) R(sel.rsv).rsv = null;
    if (r.rsv) { const q = P(r.rsv); if (q) q.rsv = null; }
    r.rsv = sel.id; sel.rsv = r.id;
    log(`${r.id} reserved for incoming EMS ${name(sel)}`, 'info');
    if (f.lvl === 'poor') toast(`Reserved, but: ${f.why}`, 'warn');
    S.sel = null; render();
    if (narrow()) $('#side').scrollIntoView({block:'start', behavior:'smooth'});
    return;
  }
  const fromQueue = sel.loc !== 'room';
  const from = sel.loc === 'room' ? sel.room : sel.loc === 'ems' ? 'EMS stretcher' : sel.loc === 'results' ? 'results waiting' : 'waiting room';
  placeInRoom(sel, r);
  log(`${name(sel)} → ${r.id} (from ${from})`, 'info');
  if (f.lvl === 'poor') toast(`⚠ ${r.id}: ${f.why}`, 'bad');
  else if (f.lvl === 'fair' && f.why) toast(`${r.id}: ${f.why}`, 'warn');
  S.sel = null; render();
  if (narrow() && fromQueue) $('#side').scrollIntoView({block:'start', behavior:'smooth'});
}
function action(a) {
  const p = S.sel && P(S.sel);
  switch (a) {
    case 'help': showHelp(); return;
    case 'newshift': showStart(); return;
    case 'deselect': S.sel = null; break;
    case 'toResults': if (p && canResultsWait(p)) { const from = p.room; vacate(p); p.loc = 'results'; log(`${name(p)} moved from ${from} to results waiting`, 'info'); S.sel = null; } break;
    case 'toWaiting': if (p && p.loc === 'ems' && p.esi >= 3 && !p.psych) { p.loc = 'waiting'; log(`${name(p)} triaged off the stretcher to the waiting room`, 'info'); S.sel = null; } break;
    case 'unreserve': if (p && p.rsv) { R(p.rsv).rsv = null; p.rsv = null; } break;
  }
  render();
}
document.addEventListener('click', e => {
  if (!S || e.target.closest('#modal')) return;
  const sp = e.target.closest('[data-speed]'); if (sp) { if (!S.ended && !S.modal) setSpeed(+sp.dataset.speed); return; }
  const ac = e.target.closest('[data-act]'); if (ac) { action(ac.dataset.act); return; }
  const pt = e.target.closest('[data-pt]'); if (pt) { select(+pt.dataset.pt); return; }
  const rm = e.target.closest('[data-room]'); if (rm) { roomClick(rm.dataset.room); return; }
  const z = e.target.closest('[data-zone]');
  if (z && S.sel) { const p = P(S.sel); if (z.dataset.zone === 'results' && p && canResultsWait(p)) action('toResults'); else if (z.dataset.zone === 'waiting' && p && p.loc === 'ems') action('toWaiting'); }
});
document.addEventListener('keydown', e => {
  if (!S || S.modal || S.ended) { if (e.key === 'Escape' && S && S.modal && !S.ended && helpOpen) closeHelp(); return; }
  if (e.key === ' ') { e.preventDefault(); setSpeed(S.speed ? 0 : (S.lastSpeed || 1)); }
  else if (e.key === '1') setSpeed(1); else if (e.key === '2') setSpeed(2); else if (e.key === '3') setSpeed(4);
  else if (e.key === 'Escape') { S.sel = null; render(); }
});
function setSpeed(v) { if (!S) return; if (S.speed) S.lastSpeed = S.speed; S.speed = v; renderTop(); }

/* ================= loop ================= */
let last = performance.now(), pointerDown = false, renderPending = false;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const pointerEnd = () => { pointerDown = false; if (renderPending) { renderPending = false; setTimeout(render, 0); } };
document.addEventListener('pointerup', pointerEnd, true);
document.addEventListener('pointercancel', pointerEnd, true);
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => S && render(), 120); });
const MIN_PER_SEC = 1; // game minutes per real second at 1×
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (S && S.speed && !S.modal && !S.ended) {
    S.acc += dt * S.speed * MIN_PER_SEC;
    let ticked = false;
    while (S.acc >= 1 && !S.modal && !S.ended) { S.acc -= 1; tick(); ticked = true; }
    if (ticked) { if (pointerDown) renderPending = true; else render(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= start / help ================= */
let helpOpen = false, helpResume = 0;
const HOW = `<ol class="how">
  <li><b>Tap a patient</b> (waiting room, EMS stretcher, incoming ambulance, or a room), then <b>tap a ready room</b>. Rooms light up <span style="color:#7fe8ad">green</span> (good fit), <span style="color:#ffc56b">amber</span> (OK) or <span style="color:#ff8f92">red</span> (risky).</li>
  <li><b>Dirty rooms</b> are cleaned automatically by EVS, first come first served, with limited crews. Tap a dirty room to make it <b>STAT</b> and jump the queue.</li>
  <li>Doctors see, test and decide on their own. When they <b>discharge</b> or <b>admit</b>, you keep space moving: send stable seen patients to <b>results waiting</b>, move <b>OBS</b> patients to the Observation Unit, and pre-assign rooms for <b>incoming EMS</b>.</li>
  <li>Long waits cause walkouts and deterioration. ESI 1–2 in unmonitored spaces, psych patients outside safe rooms, and adults in peds all carry risk.</li>
</ol>
<div class="legend">Acuity (ESI): <span class="esi e1">1</span>critical <span class="esi e2">2</span>emergent <span class="esi e3">3</span>urgent <span class="esi e4">4</span>less urgent <span class="esi e5">5</span>minor</div>
<div class="legend">Visit bar: roomed → seen → results → dispo → leaving · <span class="flag ems">EMS</span><span class="flag peds">PEDS</span><span class="flag bh">BH</span><span class="flag tr">TRA</span> · Space = pause · 1/2/3 = speed</div>`;
function showStart() {
  let diff = 'typical';
  if (S) S.speed = 0;
  const best = (() => { try { return JSON.parse(localStorage.getItem('bedboard-best') || 'null'); } catch (e) { return null; } })();
  showModal(`<div class="card wide"><div class="tag">Emergency Department · Day Shift 07:00–19:00</div>
    <h3>You're the bed manager.</h3>
    <p>34 spaces, a full waiting room, and ambulances on the radio. Get every patient into the right space, keep the rooms turning, and hand off a safe department at 19:00.</p>
    <div class="diffs">${Object.entries(DIFFS).map(([k, d]) => `<button class="opt ${k === diff ? 'on' : ''}" data-d="${k}"><b>${d.name}</b><span>${d.desc}</span></button>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span style="color:var(--muted);font-size:12px">${best ? `Best shift: ${best.grade} (${best.total})` : 'A 12-hour shift takes about 12 minutes at 1×.'}</span><button class="btn pri" id="go">Start shift</button></div>
    <details style="margin-top:12px" ${innerWidth > 820 ? 'open' : ''}><summary style="cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:6px">How to play</summary>${HOW}</details></div>`,
    el => {
      el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { diff = b.dataset.d; el.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('on', x === b)); });
      el.querySelector('#go').onclick = () => { newGame(diff); hideModal(); S.speed = 1; render(); toast('Shift started. Get the patient on the EMS stretcher into a room first.', 'info'); };
    });
}
function showHelp() {
  if (S.ended) return;
  helpOpen = true; helpResume = S.speed; setSpeed(0);
  showModal(`<div class="card wide"><div class="tag">How to play</div><h3>Bed management basics</h3>${HOW}
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn pri" id="closeHelp">Back to the board</button></div></div>`,
    el => el.querySelector('#closeHelp').onclick = closeHelp);
}
function closeHelp() { helpOpen = false; hideModal(); setSpeed(helpResume || 1); render(); }

// boot: draw a sample board behind the start card
newGame('typical'); render(); showStart();
window.__bb = {get S() { return S; }, tick, newGame, render, fit, placeInRoom, requestEVS, scoreCard, endShift, R, P};
</script>
